name: Update Docker Hub description

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
  release:
    types: [published] # keep the description in step with a published release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite repo-relative links to absolute GitHub URLs
        env:
          REPO: ${{ github.repository }}
        # Docker Hub renders the description on its own page, so a link written relative to
        # the repository root resolves to nothing there. Images need raw.githubusercontent
        # URLs to display at all, while ordinary file links want the blob view.
        run: |
          python3 - <<'PY'
          import os
          import re

          repo = os.environ["REPO"]
          blob = f"https://github.com/{repo}/blob/main/"
          raw = f"https://raw.githubusercontent.com/{repo}/main/"
          # Anything already absolute, an in-page anchor, or a mailto is left alone.
          RELATIVE = r"(?!https?://|#|/|mailto:)([^)\"]+)"

          text = open("README.md", encoding="utf-8").read()
          text = re.sub(rf"!\[([^\]]*)\]\({RELATIVE}\)", rf"![\1]({raw}\2)", text)
          text = re.sub(rf"\]\({RELATIVE}\)", rf"]({blob}\1)", text)
          text = re.sub(rf'src="{RELATIVE}"', rf'src="{raw}\1"', text)

          with open("/tmp/DOCKERHUB.md", "w", encoding="utf-8") as handle:
              handle.write(text)
          PY

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/msoauth2api
          readme-filepath: /tmp/DOCKERHUB.md
          short-description: Microsoft OAuth2 mailboxes as HTTP endpoints, with a Vue admin panel. Self-hosted.
