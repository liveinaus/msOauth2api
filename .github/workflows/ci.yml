name: CI

# Types and tests for both halves of the project.
#
# Callable as well as self-triggering, so the release flow gates on exactly the checks a
# push runs rather than a second, drifting copy of them. Node 22 to match the Dockerfile's
# builder stages -- better-sqlite3 and argon2 are native, and a version that differs from
# the image's would prove nothing about the image.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull-request runs are cancelled; pushes and the release's own call are not, so a
# release cannot lose its tests to the next commit. Keying on github.workflow means a called
# run lands in the caller's group and never collides with the push-triggered run of the same
# commit, since the two would otherwise share a ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` and not `npm install`: the lockfile is what the image builds from, and a
      # resolution CI picked on its own would test something the image never runs.
      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # `build` is vue-tsc --noEmit followed by vite build, so this covers the typecheck and
      # proves the bundle actually builds. Running typecheck separately would only repeat it.
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build
